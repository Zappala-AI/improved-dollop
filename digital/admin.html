<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Administración VNBX_STORE</title><style>body{font:15px Arial;background:#0b1020;color:#fff;margin:0;padding:18px}main{max-width:1000px;margin:auto}section{background:#151d35;border:1px solid #293557;border-radius:13px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #47557d;background:#0d1428;color:#fff}button{background:#57e0b5;color:#07111b;font-weight:bold}.danger{background:#ff7180}.card{border:1px solid #354366;border-radius:9px;padding:10px;margin:7px 0}.hide{display:none}.preview{max-width:130px;max-height:90px}</style><main><h1>VNBX_STORE · Administración</h1><p>Solo vos podés modificar la tienda.</p><section id=login><input id=password type=password placeholder=Clave><button onclick=doLogin()>Entrar</button><p id=error></p></section><div id=app class=hide><section><h2>Datos de la tienda</h2><div class=grid><input id=brand placeholder=Nombre><input id=whatsapp placeholder=549...><textarea id=whatsappMessage>Hola VNBX_STORE, quiero hacer un pedido.</textarea></div><textarea id=heroText placeholder="Descripción principal"></textarea><button onclick=saveStore()>Guardar datos</button></section><section><h2>Agregar o editar producto</h2><input id=name placeholder="Nombre"><div class=grid><input id=price placeholder=Precio><input id=stock type=number placeholder=Stock><select id=status><option value=active>Disponible</option><option value=preorder>Preventa</option><option value=soldout>Agotado</option></select><input id=category placeholder=Categoría><input id=subcategory placeholder=Subcategoría><input id=origin placeholder="Origen / proveedor privado"></div><textarea id=description placeholder="Descripción completa"></textarea><label>Fotos (podés elegir varias)<input id=files type=file accept="image/*" multiple></label><div id=previews></div><button onclick=saveProduct()>Guardar producto</button><button class=danger onclick=clearForm()>Limpiar</button></section><section><h2>Productos y stock</h2><p>Acá aparecen todos los productos. Podés editar precio, stock, descripción, fotos o eliminarlos.</p><div id=products></div></section><section><h2>Proveedores privados</h2><div class=grid><input id=supName placeholder=Nombre><input id=supPhone placeholder=Número><input id=supItems placeholder="Qué vende"><input id=supMin placeholder="Cantidad mínima"></div><button onclick=addSupplier()>Agregar proveedor</button><div id=suppliers></div></section><button onclick=logout()>Cerrar sesión</button></div></main><script>let data={products:[],content:{},suppliers:[]},ed=-1,imgs=[];const $=x=>document.getElementById(x),E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function doLogin(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(!r.ok)return error.textContent='Clave incorrecta';$('login').classList.add('hide');app.classList.remove('hide');load()}async function load(){data=await fetch('/api/store?admin=1').then(r=>r.json());brand.value=data.content?.brand||'VNBX_STORE';whatsapp.value=data.content?.whatsapp||'5492644118290';whatsappMessage.value=data.content?.whatsappMessage||'Hola VNBX_STORE, quiero hacer un pedido.';heroText.value=data.content?.heroText||'';render()}async function put(){await fetch('/api/store',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});render()}function saveStore(){data.content={...(data.content||{}),brand:brand.value,whatsapp:whatsapp.value.replace(/\D/g,''),whatsappMessage:whatsappMessage.value,heroText:heroText.value};put()}files.onchange=()=>{imgs=[];[...files.files].forEach(f=>{let r=new FileReader;r.onload=()=>{imgs.push(r.result);previews.innerHTML=imgs.map(x=>'<img class=preview src="'+x+'">').join('')};r.readAsDataURL(f)})};function clearForm(){ed=-1;['name','price','stock','category','subcategory','origin','description'].forEach(x=>$(x).value='');imgs=[];previews.innerHTML=''}function saveProduct(){if(!name.value.trim())return alert('Falta nombre');let o=ed>=0?data.products[ed]:{},p={...o,name:name.value,price:price.value,stock:stock.value,status:status.value,category:category.value,subcategory:subcategory.value,origin:origin.value,description:description.value,images:imgs.length?imgs:(o.images||[]),image:imgs[0]||o.image||''};ed>=0?data.products[ed]=p:data.products.push(p);put();clearForm()}function editProduct(i){let p=data.products[i];ed=i;name.value=p.name||'';price.value=p.price||'';stock.value=p.stock??'';status.value=p.status||'active';category.value=p.category||'';subcategory.value=p.subcategory||'';origin.value=p.origin||'';description.value=p.description||'';imgs=p.images||[]}function delProduct(i){if(confirm('¿Eliminar producto?')){data.products.splice(i,1);put()}}function render(){products.innerHTML=(data.products||[]).map((p,i)=>'<div class=card><b>'+E(p.name)+'</b> · Precio: '+E(p.price)+' · Stock: '+E(p.stock)+'<br><button onclick=editProduct('+i+')>Editar</button><button class=danger onclick=delProduct('+i+')>Eliminar</button></div>').join('')||'No hay productos';suppliers.innerHTML=(data.suppliers||[]).map((s,i)=>'<div class=card>'+E(s.name)+' · '+E(s.phone)+' · '+E(s.items)+' · mínimo '+E(s.min)+' <button class=danger onclick=delSupplier('+i+')>Eliminar</button></div>').join('')||'No hay proveedores'}function addSupplier(){data.suppliers=data.suppliers||[];data.suppliers.push({name:supName.value,phone:supPhone.value,items:supItems.value,min:supMin.value});put();['supName','supPhone','supItems','supMin'].forEach(x=>$(x).value='')}function delSupplier(i){data.suppliers.splice(i,1);put()}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()}</script>
