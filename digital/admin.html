<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Panel VNBX_STORE</title><style>body{font:15px Arial;background:#0b1020;color:#fff;margin:0;padding:18px}main{max-width:1100px;margin:auto}header,section{background:#151d35;border:1px solid #293557;border-radius:14px;padding:18px;margin:14px 0}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{width:auto}section.view{display:none}section.view.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #47557d;background:#0d1428;color:#fff}button{background:#57e0b5;color:#07111b;font-weight:bold}.danger{background:#ff7180}.alt{background:#405d8b;color:#fff}.card{border:1px solid #354366;border-radius:9px;padding:10px;margin:7px 0}.muted{color:#aab5d6}.hide{display:none}</style><main><header><h1>VNBX_STORE · Panel</h1><p class=muted>Todo separado y privado.</p></header><section id=login><input id=password type=password placeholder=Clave><button onclick=doLogin()>Entrar</button><p id=error></p></section><div id=app class=hide><nav class=nav><button onclick=tab('resumen')>Resumen</button><button onclick=tab('tienda')>Tienda</button><button onclick=tab('productos')>Productos</button><button onclick=tab('categorias')>Categorías</button><button onclick=tab('proveedores')>Proveedores</button><button onclick=tab('contactos')>Contactos</button><button onclick=logout>Cerrar sesión</button></nav><section id=resumen class="view on"><h2>Resumen</h2><div class=grid><div class=card>Productos: <b id=mp>0</b></div><div class=card>Proveedores: <b id=ms>0</b></div><div class=card>Contactos: <b id=mc>0</b></div><div class=card>Categorías: <b id=mk>0</b></div></div></section><section id=tienda class=view><h2>Tienda y WhatsApp</h2><div class=grid><input id=brand placeholder=Nombre><input id=whatsapp placeholder=549...><textarea id=whatsappMessage>Hola VNBX_STORE, quiero hacer un pedido.</textarea></div><textarea id=heroText placeholder="Descripción"></textarea><button onclick=saveStore()>Guardar tienda</button></section><section id=productos class=view><h2>Productos, precios y stock</h2><input id=name placeholder=Nombre><div class=grid><input id=price placeholder=Precio><input id=stock type=number placeholder=Stock><select id=status><option value=active>Disponible</option><option value=preorder>Preventa</option><option value=soldout>Agotado</option></select><input id=category placeholder=Categoría><input id=subcategory placeholder=Subcategoría><input id=origin placeholder="Origen/proveedor privado"></div><textarea id=description placeholder=Descripción></textarea><button onclick=saveProduct()>Guardar producto</button><div id=pl></div></section><section id=categorias class=view><h2>Categorías</h2><input id=newCat placeholder="Nueva categoría"><button onclick=addCat()>Agregar</button><div id=kl></div></section><section id=proveedores class=view><h2>Proveedores privados</h2><div class=grid><input id=sn placeholder=Nombre><input id=sp placeholder=Teléfono><input id=si placeholder="Qué vende"><input id=sm placeholder="Cantidad mínima"></div><button onclick=addSup()>Guardar proveedor</button><div id=sl></div></section><section id=contactos class=view><h2>Contactos</h2><div class=grid><input id=cn placeholder=Nombre><input id=cp placeholder=Teléfono><input id=ct placeholder=Nota></div><button onclick=addCon()>Guardar contacto</button><div id=cl></div></section></div></main><script>let d={products:[],categories:[],suppliers:[],contacts:[],content:{}};const $=x=>document.getElementById(x),e=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function tab(x){document.querySelectorAll('.view').forEach(a=>a.classList.remove('on'));$(x).classList.add('on')}async function doLogin(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(!r.ok)return error.textContent='Clave incorrecta';$('login').classList.add('hide');$('app').classList.remove('hide');load()}async function load(){d=await fetch('/api/store?admin=1').then(r=>r.json());d.products=d.products||[];d.categories=d.categories||[];d.suppliers=d.suppliers||[];d.contacts=d.contacts||[];let c=d.content||{};brand.value=c.brand||'VNBX_STORE';whatsapp.value=c.whatsapp||'5492644118290';whatsappMessage.value=c.whatsappMessage||'Hola VNBX_STORE, quiero hacer un pedido.';heroText.value=c.heroText||'';render()}async function put(){await fetch('/api/store',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});render()}function saveStore(){d.content={...(d.content||{}),brand:brand.value,whatsapp:whatsapp.value.replace(/\D/g,''),whatsappMessage:whatsappMessage.value,heroText:heroText.value};put()}function saveProduct(){if(!name.value.trim())return alert('Falta nombre');d.products.push({name:name.value,price:price.value,stock:stock.value,status:status.value,category:category.value,subcategory:subcategory.value,origin:origin.value,description:description.value});put();['name','price','stock','category','subcategory','origin','description'].forEach(x=>$(x).value='')}function delP(i){if(confirm('¿Eliminar producto?')){d.products.splice(i,1);put()}}function addCat(){if(newCat.value.trim()){d.categories.push(newCat.value);newCat.value='';put()}}function delK(i){d.categories.splice(i,1);put()}function addSup(){d.suppliers.push({name:sn.value,phone:sp.value,items:si.value,min:sm.value});['sn','sp','si','sm'].forEach(x=>$(x).value='');put()}function delS(i){d.suppliers.splice(i,1);put()}function addCon(){d.contacts.push({name:cn.value,phone:cp.value,note:ct.value});['cn','cp','ct'].forEach(x=>$(x).value='');put()}function delC(i){d.contacts.splice(i,1);put()}function render(){mp.textContent=d.products.length;ms.textContent=d.suppliers.length;mc.textContent=d.contacts.length;mk.textContent=d.categories.length;pl.innerHTML=d.products.map((p,i)=>'<div class=card><b>'+e(p.name)+'</b> · Precio: '+e(p.price)+' · Stock: '+e(p.stock)+'<button class=danger onclick=delP('+i+')>Eliminar</button></div>').join('')||'No hay productos';kl.innerHTML=d.categories.map((x,i)=>'<div class=card>'+e(x)+' <button class=danger onclick=delK('+i+')>Eliminar</button></div>').join('')||'No hay categorías';sl.innerHTML=d.suppliers.map((x,i)=>'<div class=card>'+e(x.name)+' · '+e(x.phone)+' · '+e(x.items)+' <button class=danger onclick=delS('+i+')>Eliminar</button></div>').join('')||'No hay proveedores';cl.innerHTML=d.contacts.map((x,i)=>'<div class=card>'+e(x.name)+' · '+e(x.phone)+' · '+e(x.note)+' <button class=danger onclick=delC('+i+')>Eliminar</button></div>').join('')||'No hay contactos'}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()}</script>
