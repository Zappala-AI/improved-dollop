<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · VNBX_STORE</title><style>body{font-family:Arial;margin:0;background:#0b1020;color:#eef;padding:24px}main{max-width:900px;margin:auto}section{background:#151d35;border:1px solid #293557;border-radius:16px;padding:20px;margin:16px 0}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #47557d;background:#0d1428;color:#fff}button{background:#57e0b5;color:#07111b;font-weight:bold;cursor:pointer}.danger{background:#ff7180}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid #354366;border-radius:12px;padding:12px;margin:8px 0}.preview{max-width:180px;max-height:140px;border-radius:12px;object-fit:cover}.muted{color:#aab5d6}#app{display:none}.pick{background:#405d8b;color:#fff}.tag{display:inline-block;background:#405d8b;border-radius:20px;padding:7px 12px;margin:4px}</style><main><h1>VNBX_STORE · Administración</h1><p class="muted">Panel privado. Imágenes desde carpetas, galería o cámara.</p><section id="access"><h2 id="accessTitle">Acceso</h2><p id="accessHelp" class="muted"></p><input id="password" type="password" placeholder="Clave de administración"><button onclick="access()">Continuar</button><p id="msg"></p></section><div id="app"><section><h2>Categorías y subcategorías</h2><p class="muted">Ejemplo: Ropa y luego Remeras, Pantalones o Camisas.</p><div class="grid"><input id="newCat" placeholder="Nueva categoría"><button onclick="addCategory()">Agregar categoría</button></div><div id="cats"></div></section><section><h2>Imagen oficial de la tienda</h2><input class="pick" id="heroFile" type="file" accept="image/*" onchange="readImage(this,'heroPreview','heroImage')"><br><img id="heroPreview" class="preview"><h2>Datos de la tienda</h2><div class="grid"><label>Nombre<input id="brand"></label><label>WhatsApp sin + ni espacios<input id="wa" placeholder="549..."></label></div><textarea id="desc" placeholder="Descripción"></textarea><button onclick="saveStore()">Guardar tienda e imagen</button></section><section><h2>Agregar producto</h2><div class="grid"><input id="name" placeholder="Nombre"><select id="cat"><option value="">Categoría</option></select><input id="subcat" placeholder="Subcategoría: remera, camisa..."><input id="price" placeholder="Precio"><select id="status"><option value="available">Disponible</option><option value="preorder">Preventa</option><option value="soldout">Agotado</option></select></div><textarea id="detail" placeholder="Descripción"></textarea><input class="pick" id="productFile" type="file" accept="image/*" onchange="readImage(this,'productPreview','productImage')"><br><img id="productPreview" class="preview"><button onclick="addProduct()">Agregar producto</button></section><section><h2>Productos</h2><div id="products"></div></section></div></main><script>let key='',store={products:[],categories:['Tecnología','Perfumes','Ropa','Gorras','Accesorios']},heroImage='',productImage='';const $=id=>document.getElementById(id);function readImage(i,p,t){const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$(p).src=r.result;window[t]=r.result};r.readAsDataURL(f)}function cats(){store.categories=[...new Set(store.categories||[])];$('cat').innerHTML='<option value="">Categoría</option>'+store.categories.map(x=>'<option>'+x+'</option>').join('');$('cats').innerHTML=store.categories.map((x,i)=>'<span class="tag">'+x+' <button onclick="removeCategory('+i+')">×</button></span>').join('')}function addCategory(){const v=$('newCat').value.trim();if(v&&!store.categories.includes(v)){store.categories.push(v);$('newCat').value='';cats();put()}}function removeCategory(i){store.categories.splice(i,1);cats();put()}async function access(){const p=$("password").value;if(!p)return;const c=(await fetch('/api/auth/status').then(r=>r.json())).configured;const r=await fetch(c?'/api/auth/login':'/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok){$('msg').textContent=d.error||'No se pudo acceder';return}key=d.key||p;localStorage.vnbxAdmin=key;await load();$('access').style.display='none';$('app').style.display='block'}async function load(){store=await fetch('/api/store').then(r=>r.json());store.categories=store.categories||['Tecnología','Perfumes','Ropa','Gorras','Accesorios'];$('brand').value=store.brand||'VNBX_STORE';$('wa').value=store.whatsapp||'';$('desc').value=store.description||'';heroImage=store.heroImage||'';if(heroImage)$('heroPreview').src=heroImage;cats();render()}function render(){$('products').innerHTML=(store.products||[]).map((p,i)=>'<div class="card">'+(p.image?'<img src="'+p.image+'" class="preview"><br>':'')+'<b>'+p.name+'</b> · '+(p.price||'Sin precio')+'<br><span class="muted">'+(p.category||'')+' / '+(p.subcategory||'')+' · '+(p.status||'available')+'</span><br><button class="danger" onclick="removeProduct('+i+')">Eliminar</button></div>').join('')||'<p class="muted">Todavía no hay productos.</p>'}async function saveStore(){store.brand=$('brand').value;store.whatsapp=$('wa').value;store.description=$('desc').value;store.heroImage=heroImage;await put();alert('Guardado')}async function addProduct(){if(!$('name').value)return;store.products.push({name:$('name').value,category:$('cat').value,subcategory:$('subcat').value,price:$('price').value,image:productImage,description:$('detail').value,status:$('status').value,active:true});productImage='';$('productPreview').src='';await put();['name','subcat','price','detail'].forEach(x=>$(x).value='');$('productFile').value=''}async function removeProduct(i){store.products.splice(i,1);await put()}async function put(){const r=await fetch('/api/store',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(store)});if(!r.ok)return alert('Sesión vencida o clave incorrecta');store=await r.json();store.categories=store.categories||[];cats();render()}window.addEventListener('load',async()=>{const saved=localStorage.vnbxAdmin;if(saved){key=saved;const r=await fetch('/api/store');if(r.ok){await load();$('access').style.display='none';$('app').style.display='block';return}}const c=(await fetch('/api/auth/status').then(r=>r.json())).configured;$('accessTitle').textContent=c?'Ingresar':'Crear clave privada';$('accessHelp').textContent=c?'Ingresá la clave que van a usar vos y tus socios.':'Primera vez: elegí una clave de al menos 6 caracteres.'});</script></html>
