<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · VNBX_STORE</title><style>body{font-family:Arial;margin:0;background:#0b1020;color:#eef;padding:24px}main{max-width:900px;margin:auto}section{background:#151d35;border:1px solid #293557;border-radius:16px;padding:20px;margin:16px 0}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #47557d;background:#0d1428;color:#fff}button{background:#57e0b5;color:#07111b;font-weight:bold;cursor:pointer}.danger{background:#ff7180}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{border:1px solid #354366;border-radius:12px;padding:12px;margin:8px 0}.muted{color:#aab5d6}#app{display:none}</style><main><h1>VNBX_STORE · Administración</h1><p class="muted">Panel privado. Solo se publica lo que guardes aquí.</p><section id="access"><h2 id="accessTitle">Acceso</h2><p id="accessHelp" class="muted"></p><input id="password" type="password" placeholder="Clave de administración"><button onclick="access()">Continuar</button><p id="msg"></p></section><div id="app"><section><h2>Datos de la tienda</h2><div class="grid"><label>Nombre<input id="brand"></label><label>WhatsApp sin + ni espacios<input id="wa" placeholder="549..."/></label></div><label>Descripción<textarea id="desc"></textarea></label><button onclick="saveStore()">Guardar tienda</button></section><section><h2>Agregar producto</h2><div class="grid"><input id="name" placeholder="Nombre"><input id="cat" placeholder="Categoría"><input id="price" placeholder="Precio"><input id="image" placeholder="URL de imagen"><select id="status"><option value="available">Disponible</option><option value="preorder">Preventa</option><option value="soldout">Agotado</option></select></div><textarea id="detail" placeholder="Descripción"></textarea><button onclick="addProduct()">Agregar producto</button></section><section><h2>Productos</h2><div id="products"></div></section></div></main><script>let key='',store={products:[]};const $=id=>document.getElementById(id);async function access(){const p=$("password").value;if(!p)return;let configured=(await fetch('/api/auth/status').then(r=>r.json())).configured;let url=configured?'/api/auth/login':'/api/auth/setup';let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});let d=await r.json();if(!r.ok){$('msg').textContent=d.error||'No se pudo acceder';return}key=d.key||p;localStorage.vnbxAdmin=key;await load();$('access').style.display='none';$('app').style.display='block'}async function load(){let r=await fetch('/api/store');store=await r.json();$('brand').value=store.brand||'VNBX_STORE';$('wa').value=store.whatsapp||'';$('desc').value=store.description||'';render()}function render(){$('products').innerHTML=(store.products||[]).map((p,i)=>'<div class="card"><b>'+p.name+'</b> · '+(p.price||'Sin precio')+'<br><span class="muted">'+(p.category||'')+' · '+(p.status||'available')+'</span><br><button class="danger" onclick="removeProduct('+i+')">Eliminar</button></div>').join('')||'<p class="muted">Todavía no hay productos.</p>'}async function saveStore(){store.brand=$('brand').value;store.whatsapp=$('wa').value;store.description=$('desc').value;await put();alert('Guardado')}async function addProduct(){store.products.push({name:$('name').value,category:$('cat').value,price:$('price').value,image:$('image').value,description:$('detail').value,status:$('status').value,active:true});await put();['name','cat','price','image','detail'].forEach(x=>$(x).value='')}async function removeProduct(i){store.products.splice(i,1);await put()}async function put(){let r=await fetch('/api/store',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(store)});if(!r.ok)alert('Sesión vencida o clave incorrecta');store=await r.json();render()}window.addEventListener('load',async()=>{let saved=localStorage.vnbxAdmin;if(saved){key=saved;let r=await fetch('/api/store');if(r.ok){await load();$('access').style.display='none';$('app').style.display='block';return}}let c=(await fetch('/api/auth/status').then(r=>r.json())).configured;$('accessTitle').textContent=c?'Ingresar':'Crear clave privada';$('accessHelp').textContent=c?'Ingresá la clave que van a usar vos y tus socios.':'Primera vez: elegí una clave de al menos 6 caracteres.'});</script></html>
